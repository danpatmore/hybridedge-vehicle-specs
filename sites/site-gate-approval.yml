# Runs the site gate again when someone comments "approve ..." on a pull
# request (23 Nov 2026, Codex round 160). issue_comment always runs main's
# copy of this file. The gate decides whether the comment is the developer's
# own approval of the PR's current files; anything else changes nothing.
name: Site gate (approval)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  run-gate:
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, 'approve')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gate
    steps:
      - uses: actions/checkout@v4
        with:
          repository: danpatmore/hybridedge-vehicle-specs
          ref: main
          path: gate
          persist-credentials: false
      - name: Gate
        env:
          REPO: ${{ github.repository }}
          GATE_APP_ID: ${{ vars.GATE_APP_ID }}
          GATE_APP_KEY: ${{ secrets.GATE_APP_KEY }}
        run: python3 -I gate/tools/gate.py --site "${{ github.event.issue.number }}"
