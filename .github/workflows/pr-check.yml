# Runs on every pull request that changes a data file (22 Nov 2026). It backs
# up the developer's review of routine PRs; it never merges anything.
name: Data PR check

on:
  pull_request:
    paths:
      - phev-specs-au.json
      - energy-plans-au.json
      - lease-rules-au.json
      - checks/confirm-delisted.json

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Compare with main
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/base"
          for f in phev-specs-au.json energy-plans-au.json lease-rules-au.json; do
            git show "origin/${{ github.base_ref }}:$f" > "$RUNNER_TEMP/base/$f" 2>/dev/null || rm -f "$RUNNER_TEMP/base/$f"
          done
          python3 -I tools/check-pr.py "$RUNNER_TEMP/base" . --summary "$RUNNER_TEMP/pr.md"; status=$?
          if ! git diff --quiet "origin/${{ github.base_ref }}" -- checks/confirm-delisted.json; then
            python3 -I tools/delisted.py check "$RUNNER_TEMP/base/energy-plans-au.json" | tee -a "$RUNNER_TEMP/pr.md" || status=1
          fi
          cat "$RUNNER_TEMP/pr.md" >> "$GITHUB_STEP_SUMMARY"
          echo "$status" > "$RUNNER_TEMP/status"
          exit $status
      # Routine PRs are opened under the developer's own account, and GitHub
      # never notifies you of your own actions. A comment from the bot does,
      # so the GitHub app pings the developer's phone.
      - name: Ping the developer about a new routine PR
        if: always() && github.event.action == 'opened' && startsWith(github.head_ref, 'claude/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(cat "$RUNNER_TEMP/status" 2>/dev/null)" = "0" ]; then
            verdict="The automatic check passed."
          else
            verdict="The automatic check found problems (see Checks)."
          fi
          gh pr comment "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" \
            --body "New data change from a scheduled routine, ready for your review. $verdict Nothing reaches phones until you merge it."
