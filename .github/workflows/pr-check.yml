# The gate on every pull request (22 Nov 2026; reworked after Codex rounds
# 157 and 158). It runs from main (pull_request_target), so a PR cannot change
# the check that certifies it: main's tools/gate.py checks the PR's data,
# copied out as plain text, and looks for the developer's approval comment.
# Nothing from the PR is ever run.
#
# The result is posted as the check "data-gate" by the developer's own GitHub
# App, whose key is in the "gate" environment, which only main may use. Main's
# ruleset requires data-gate from that app, so a workflow a PR adds, which
# reports as GitHub Actions, cannot stand in for it. gate-approval.yml runs
# the same gate when the developer comments.
name: Data gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

concurrency:
  group: gate-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  run-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: gate
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Gate
        env:
          REPO: ${{ github.repository }}
          GATE_APP_ID: ${{ vars.GATE_APP_ID }}
          GATE_APP_KEY: ${{ secrets.GATE_APP_KEY }}
        run: python3 -I tools/gate.py "${{ github.event.pull_request.number }}"
